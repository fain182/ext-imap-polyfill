# Drop-in for the dovecot/dovecot image (Dovecot 2.4), mounted into
# /etc/dovecot/conf.d/. The image's own config already supplies a static
# passdb that accepts any username with $USER_PASSWORD, which is all a test
# fixture needs.
#
# This server exists for what GreenMail cannot do: THREAD and ACL. Its
# unprivileged IMAP listener is on 31143, not 143 (see vendor.d/rootless.conf
# in the image).

protocols = imap pop3

# The fixture speaks plain IMAP on a loopback/CI network, with no TLS.
auth_allow_cleartext = yes

mail_plugins {
  acl = yes
}

protocol imap {
  mail_plugins {
    imap_acl = yes
  }
}

# Required, and the only driver there is: with it empty the acl plugin stays
# off and every ACL command answers "Mailbox doesn't exist".
acl_driver = vfile

# The fixture that advertises STARTTLS, so the upgrade c-client performs
# whenever a server offers one has somewhere to be checked against the real
# extension — Greenmail announces nothing on its cleartext port. The
# certificate is generated by `make dovecot-up` and self-signed, which is
# why every spec here carries /novalidate-cert.
ssl = yes

# c-client's STARTTLS asks for TLS 1.0 and nothing else — ssl_unix.c builds
# its context with TLSv1_client_method() unless the spec says /tls-sslv23 —
# so a fixture on 2.4's TLSv1.2 default is one the real extension cannot
# upgrade to, and there is no comparison left to make. SECLEVEL=0 is what
# lets OpenSSL 3 complete that handshake at all. Loopback fixture only.
ssl_min_protocol = TLSv1
ssl_cipher_list = ALL:@SECLEVEL=0

# Enabled so the suite's quota and POP3 coverage can run against this server
# too, not just Greenmail. A zero limit means unlimited in Dovecot, so the
# quota tests set their own.
mail_plugins {
  quota = yes
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

quota storage {
  quota_storage_size = 0
}

# Greenmail advertises no AUTH= mechanism c-client knows, so `/anonymous`
# never gets past LOGIN there. Enabled here to give AUTHENTICATE ANONYMOUS —
# the form c-client prefers whenever a server offers it — somewhere to run.
auth_mechanisms = plain anonymous
