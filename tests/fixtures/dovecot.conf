# Drop-in for the dovecot/dovecot image (Dovecot 2.4), mounted into
# /etc/dovecot/conf.d/. The image's own config already supplies a static
# passdb that accepts any username with $USER_PASSWORD, which is all a test
# fixture needs.
#
# This server exists for what GreenMail cannot do: THREAD and ACL. Its
# unprivileged IMAP listener is on 31143, not 143 (see vendor.d/rootless.conf
# in the image).

protocols = imap pop3

# The fixture speaks plain IMAP on a loopback/CI network, with no TLS.
auth_allow_cleartext = yes

mail_plugins {
  acl = yes
}

protocol imap {
  mail_plugins {
    imap_acl = yes
  }
}

# Required, and the only driver there is: with it empty the acl plugin stays
# off and every ACL command answers "Mailbox doesn't exist".
acl_driver = vfile

# c-client upgrades to STARTTLS whenever the server advertises it, and this
# fixture has no usable certificate: keep the announcement off entirely.
ssl = no

# Enabled so the suite's quota and POP3 coverage can run against this server
# too, not just Greenmail. A zero limit means unlimited in Dovecot, so the
# quota tests set their own.
mail_plugins {
  quota = yes
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

quota storage {
  quota_storage_size = 0
}
