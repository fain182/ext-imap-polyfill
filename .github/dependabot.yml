version: 2

updates:
  # Actions used by .github/workflows/tests.yml (actions/checkout,
  # shivammathur/setup-php).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # composer.json. No lock file is committed, so CI already installs the newest
  # release each constraint allows; what is left for Dependabot is a release
  # outside a constraint. `widen` adds it to the range instead of raising the
  # floor, which in a library would take the older releases away from users.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: widen
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker images in docker-compose.yml (the Greenmail and Dovecot test
  # fixtures) and in Dockerfile.parity.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Dockerfile.parity is pinned to php:8.3-cli-bookworm on purpose and must
      # not be bumped: 8.3 is the last PHP release that ships ext-imap in core
      # (the whole point of the parity job is running against the genuine
      # extension), and bookworm is the last Debian release that still packages
      # libc-client, which ext-imap wraps.
      - dependency-name: "php"
