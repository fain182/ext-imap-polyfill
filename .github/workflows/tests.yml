name: Tests

on:
  # Every branch, so a push is checked while it is still being worked on
  # rather than at the pull request that ends it. A pull request from a fork
  # pushes nowhere this repository can see, so it keeps a trigger of its own
  # — and one from a branch here would run everything twice, which the `if`
  # on each job below declines.
  push:
  pull_request:

jobs:
  test:
    name: "PHP ${{ matrix.php }}"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      # The runner's base PHP install can have ext-imap already enabled as a
      # shared extension. This "test" job exists to exercise the polyfill
      # itself, so ext-imap must be off here — otherwise bootstrap.php's
      # extension_loaded('imap') guard silently defers to the real extension
      # and these tests stop testing our code at all. (The "parity" job below
      # wants the real extension present, so it's untouched.)
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  # The matrix above installs from composer.lock, so every one of its legs gets
  # the same pinned dependency set: the top of each constraint, and only that.
  # This job re-resolves to the oldest releases composer.json allows, which is
  # the only place `^1.25` on imapengine is tested as the promise it is. PHP 8.1
  # because it is the floor we claim, and composer's platform config resolves
  # for 8.1 regardless.
  lowest-deps:
    name: "Oldest allowed dependencies (PHP 8.1)"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: ':imap'
          coverage: none

      # Rewrites composer.lock to the oldest set; the test targets below run
      # `composer install` underneath, which reads that rewritten lock rather
      # than the committed one, so the downgrade survives into the runs.
      - name: Composer install (oldest allowed)
        run: make install-lowest

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  phpstan:
    name: "PHPStan"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: PHPStan
        run: make phpstan

  parity:
    name: "Parity vs real ext-imap (PHP 8.3)"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run parity suite
        run: make parity

  # The extension's own .phpt suite, vendored in tests/phpt. It is the one
  # suite here nobody on this project wrote: a failure is a divergence from
  # the extension as the people who wrote it characterised it. PHP 8.5
  # because that is what a codebase reaching for this package is on — the
  # ten it cannot answer say so in an --XFAIL--, and two of those are PHP
  # 8.5's own wording rather than ours.
  phpt:
    name: "Extension's own .phpt suite (PHP 8.5)"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: Run the extension's own tests
        run: make phpt

  # `make cross-check` points the Greenmail-targeted suite at Dovecot instead,
  # skipping the tests tagged greenmail-only. It answers a question the other
  # jobs cannot: whether a test, or the polyfill itself, has grown attached to
  # one server's behaviour — which is how the POP3 uid bug surfaced, where
  # imap_uid() returned a UIDL string cast to int that happens to be the
  # message number on Greenmail and is nonsense anywhere else. It was an audit
  # to run by hand before a release, so it held only as well as the discipline
  # around it; here it holds on every push. PHP 8.5 for the same reason the
  # phpt job takes it — the version a codebase reaching for this package is on
  # — since what this checks is orthogonal to the language version.
  cross-check:
    name: "Cross-check vs second server (Dovecot)"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # As in the "test" job: ext-imap off, or bootstrap.php defers to the real
      # extension and this stops exercising the polyfill at all.
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: Cross-check against Dovecot
        run: make cross-check
