name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      # The runner's base PHP install can have ext-imap already enabled as a
      # shared extension. This "test" job exists to exercise the polyfill
      # itself, so ext-imap must be off here — otherwise bootstrap.php's
      # extension_loaded('imap') guard silently defers to the real extension
      # and these tests stop testing our code at all. (The "parity" job below
      # wants the real extension present, so it's untouched.)
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  # The matrix above installs from composer.lock, so every one of its legs gets
  # the same pinned dependency set: the top of each constraint, and only that.
  # This job re-resolves to the oldest releases composer.json allows, which is
  # the only place `^1.25` on imapengine is tested as the promise it is. PHP 8.1
  # because it is the floor we claim, and composer's platform config resolves
  # for 8.1 regardless.
  lowest-deps:
    name: "Oldest allowed dependencies (PHP 8.1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: ':imap'
          coverage: none

      # Rewrites composer.lock to the oldest set; the test targets below run
      # `composer install` underneath, which reads that rewritten lock rather
      # than the committed one, so the downgrade survives into the runs.
      - name: Composer install (oldest allowed)
        run: make install-lowest

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  phpstan:
    name: "PHPStan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ':imap'
          coverage: none

      - name: Composer install
        run: make install

      - name: PHPStan
        run: make phpstan

  parity:
    name: "Parity vs real ext-imap (PHP 8.3)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parity suite
        run: make parity
